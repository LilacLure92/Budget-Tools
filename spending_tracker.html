<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Log Expense Tracker</title>
  <style>
    body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f3f7; color: #2d2338; max-width: 500px; margin: 0 auto; padding: 16px; }
    h2 {text-align: center; color: #5c3d75; margin-top: 0; margin-bottom: 12px; font-size: 20px; }
    
    /* Universal Resizable Section Cards */
    .card {
      background: white; 
      padding: 14px; 
      border-radius: 12px; 
      box-shadow: 0 4px 12px rgba(92, 61, 117, 0.08); 
      margin-bottom: 12px; 
      resize: vertical; 
      overflow: auto; 
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      border: 1px solid #ece4f2;
    }
    
    /* Compact, Fitted Logging Card (No Scrolling Needed) */
    .log-card { padding: 10px 12px; min-height: auto; height: auto; }
    .input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .input-col { flex: 1; display: flex; flex-direction: column; }
    .log-card label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 11px; color: #5c3d75; }
    .log-card input, .log-card select { width: 100%; padding: 5px 8px; margin: 0; border: 1px solid #dcd6e3; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .log-card button { background-color: #7b5299; color: white; border: none; padding: 7px 10px; width: 100%; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .log-card button:hover { background-color: #633c7d; }
    .log-card .secondary-btn { background-color: #9c7bb8; margin: 0; }
    .log-card .secondary-btn:hover { background-color: #7b5299; }
    
    /* Compact, Fitted Import/Export Area (No Scrolling Needed) */
    .io-card { padding: 8px 10px; min-height: auto; height: auto; text-align: center; }
    .export-btn { background-color: #528699; color: white; border: none; padding: 7px 8px; flex: 1; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 0; white-space: nowrap; }
    .export-btn:hover { background-color: #3e6675; }
    .import-btn { background-color: #865299; color: white; border: none; padding: 7px 8px; flex: 1; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin: 0; white-space: nowrap; }
    .import-btn:hover { background-color: #6a3d78; }
    
    /* Resizable Summary Totals Card */
    .stats-card { min-height: 110px; padding: 10px; }
    .totals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .time-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; } 
    .total-box { background: #f0ebf5; padding: 8px 4px; border-radius: 8px; text-align: center; }
    .total-box span { display: block; font-size: 9px; color: #665b73; text-transform: uppercase; }
    .total-box strong { font-size: 13px; color: #5c3d75; }
    
    /* Resizable Category Breakdown Area */
    .breakdown-card { height: 180px; min-height: 90px; }
    #categoryBreakdownList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cat-row { background: #f9f7fc; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #ece4f2; }
    .cat-header { font-weight: bold; color: #5c3d75; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .cat-actions { font-size: 11px; }
    .cat-action-btn { background: none; border: none; cursor: pointer; font-weight: bold; padding: 0 3px; width: auto; }
    .move-btn { color: #7b5299; }
    .edit-cat-btn { color: #528699; }
    .delete-cat-btn { color: #cc4444; }
    
    .cat-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-size: 10px; color: #554863; }
    .cat-stats div span { display: block; font-size: 8px; color: #887a96; text-transform: uppercase; }
    
    /* Resizable Recent Log Area */
    .recent-card { height: 360px; min-height: 120px; }
    ul#expenseList {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .delete-btn { background: none; border: none; color: #cc4444; cursor: pointer; font-weight: bold; padding: 0 5px; width: auto; }
    .edit-btn { background: none; border: none; color: #528699; cursor: pointer; font-weight: bold; padding: 0 5px; width: auto; font-size: 14px; }
    
    /* Filter & Sort Dropdown Controls */
    .sort-container { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5c3d75; flex-wrap: wrap; justify-content: flex-end; }
    .sort-container select { max-width: 105px; padding: 3px 6px; font-size: 11px; margin: 0; border: 1px solid #dcd6e3; border-radius: 6px; background: white; color: #2d2338; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;}
  </style>
</head>
<body>
  <h2>Quick Log Tracker</h2>
  
  <!-- Compact Logging Card -->
  <div class="card log-card">
    <label for="newCategory">Add New Category</label>
    <div class="input-row">
      <input type="text" id="newCategory" placeholder="e.g., Household, Personal Care" style="flex: 1;">
      <button class="secondary-btn" onclick="addCategory()" style="width: auto; padding: 5px 12px;">Add</button>
    </div>
    
    <div class="input-row" style="margin-top: 2px;">
      <div class="input-col" style="flex: 1;">
        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" step="0.01" placeholder="0.00">
      </div>
      <div class="input-col" style="flex: 1.5;">
        <label for="category">Category</label>
        <select id="category">
          <!-- Categories load dynamically -->
        </select>
      </div>
    </div>
    <button onclick="addExpense()" style="margin-top: 6px;">Add Expense</button>
  </div>

  <!-- Compact Import/Export Card -->
  <div class="card io-card">
    <div class="input-row" style="margin: 0;">
      <button class="export-btn" onclick="exportBackup()">📥 Export Backup</button>
      <button class="import-btn" onclick="document.getElementById('importFile').click()">📂 Import Backup</button>
    </div>
    <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importBackup(event)">
  </div>

  <!-- Resizable Totals & Time Stats Card -->
  <div class="card stats-card">
    <div class="time-grid">
      <div class="total-box">
        <span>Since Fri.</span>
        <strong id="sinceFriTotal">$0.00</strong>
      </div>
      <div class="total-box">
        <span>Prev Wk.</span>
        <strong id="lastWeekTotal">$0.00</strong>
      </div>
      <div class="total-box">
        <span>Last Mo.</span>
        <strong id="lastMonthTotal">$0.00</strong>
      </div>
      <div class="total-box">
        <span>This Mo.</span>
        <strong id="monthTotal">$0.00</strong>
      </div>
      <div class="total-box">
        <span>Year</span>
        <strong id="yearTotal">$0.00</strong>
      </div>
    </div>

    <div class="totals-grid">
      <div class="total-box">
        <span>All-Time Total</span>
        <strong id="grandTotal">$0.00</strong>
      </div>
      <div class="total-box">
        <span>Entries</span>
        <strong id="entryCount">0</strong>
      </div>
    </div>
  </div>

  <!-- Resizable Category Breakdown Card -->
  <div class="card breakdown-card">
    <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 15px; color: #5c3d75;">Breakdown by Category</h3>
    <div id="categoryBreakdownList">
      <div style="text-align: center; color: #888; font-size: 13px;">No category data yet.</div>
    </div>
  </div>

  <!-- Resizable Recent Log Card -->
  <div class="card recent-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h3 style="margin: 0; font-size: 15px; color: #5c3d75;">Recent Log</h3>
      <div class="sort-container">
        
        <!-- Updated Time Filter Dropdown -->
        <select id="filterTime" onchange="saveAndRender()">
          <option value="ALL">All Time</option>
          <option value="sinceFri">Since Last Fri</option>
          <option value="lastMonth">Since Last Mo.</option>
          <option value="pastYear">Past Year</option>
        </select>

        <!-- Category Filter Dropdown -->
        <select id="filterCategory" onchange="saveAndRender()">
          <option value="ALL">All Categories</option>
          <!-- Categories load dynamically -->
        </select>
        
        <!-- Sort Dropdown -->
        <select id="sortBy" onchange="saveAndRender()">
          <option value="entry">Order Entered</option>
          <option value="dateDesc">Date (Newest)</option>
          <option value="dateAsc">Date (Oldest)</option>
          <option value="amountDesc">Amt (High-Low)</option>
          <option value="amountAsc">Amt (Low-High)</option>
        </select>
      </div>
    </div>
    <ul id="expenseList">
      <li style="text-align: center; color: #888;">No expenses logged yet.</li>
    </ul>
  </div>

  <script>
    let categories = JSON.parse(localStorage.getItem('quick_categories')) || [
      "Car Gas", "Food & Groceries", "Cat Care", "Utilities & Bills", "Flex & Treats", "Vacation Savings", "Tax Savings"
    ];
    let expenses = JSON.parse(localStorage.getItem('quick_expenses')) || [];

    function updateCategoryDropdown() {
      const select = document.getElementById('category');
      const filterSelect = document.getElementById('filterCategory');
      const currentFilter = filterSelect ? filterSelect.value : 'ALL';
      
      select.innerHTML = '';
      if (filterSelect) {
        filterSelect.innerHTML = '<option value="ALL">All Categories</option>';
      }

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);

        if (filterSelect) {
          const fOption = document.createElement('option');
          fOption.value = cat;
          fOption.textContent = cat;
          filterSelect.appendChild(fOption);
        }
      });

      if (filterSelect && categories.includes(currentFilter)) {
        filterSelect.value = currentFilter;
      }
    }

    function addCategory() {
      const input = document.getElementById('newCategory');
      const newCat = input.value.trim();
      if (newCat === '') {alert('Please type a category name.'); return; }
      if (categories.includes(newCat)) {alert('That category already exists!'); return; }
      categories.push(newCat);
      localStorage.setItem('quick_categories', JSON.stringify(categories));
      updateCategoryDropdown();
      saveAndRender();
      input.value = '';
    }

    function moveCategory(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= categories.length) return;
      const temp = categories[index];
      categories[index] = categories[newIndex];
      categories[newIndex] = temp;
      localStorage.setItem('quick_categories', JSON.stringify(categories));
      updateCategoryDropdown();
      saveAndRender();
    }

    function editCategory(oldName) {
      const newName = prompt(`Rename category "${oldName}" to:`, oldName);
      if (!newName || newName.trim() === '') return;
      const trimmed = newName.trim();
      if (categories.includes(trimmed)) {alert('A category with that name already exists!'); return; }
      const index = categories.indexOf(oldName);
      if (index !== -1) {categories[index] = trimmed; }
      expenses.forEach(exp => {if (exp.category === oldName) {exp.category = trimmed; } });
      localStorage.setItem('quick_categories', JSON.stringify(categories));
      updateCategoryDropdown();
      saveAndRender();
    }

    function deleteCategory(catName) {
      if (categories.length <= 1) {alert('You must keep at least one category.'); return; }
      if (confirm(`Are you sure you want to delete category "${catName}"? Expenses logged under this category will also be removed.`)) {
        categories = categories.filter(c => c !== catName);
        expenses = expenses.filter(exp => exp.category !== catName);
        localStorage.setItem('quick_categories', JSON.stringify(categories));
        updateCategoryDropdown();
        saveAndRender();
      }
    }

    function addExpense() {
      const amountInput = document.getElementById('amount');
      const categorySelect = document.getElementById('category');
      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) {alert('Please enter a valid amount.'); return; }
      const expense = {
        id: Date.now(),
        amount: amount,
        category: categorySelect.value,
        label: "",
        timestamp: new Date().toISOString(),
        dateFormatted: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };
      expenses.unshift(expense);
      saveAndRender();
      amountInput.value = '';
    }

    function editExpense(id) {
      const exp = expenses.find(e => e.id === id);
      if (!exp) return;

      const newCat = prompt(`Edit Category (Current: ${exp.category})\nAvailable: ${categories.join(', ')}`, exp.category);
      if (newCat !== null) {
        const trimmedCat = newCat.trim();
        if (categories.includes(trimmedCat)) {
          exp.category = trimmedCat;
        } else if (trimmedCat !== "") {
          if(confirm(`"${trimmedCat}" is not an existing category. Add it as a new category?`)) {
            categories.push(trimmedCat);
            localStorage.setItem('quick_categories', JSON.stringify(categories));
            updateCategoryDropdown();
            exp.category = trimmedCat;
          }
        }
      }

      const newLabel = prompt("Add or edit a label/note for this entry:", exp.label || "");
      if (newLabel !== null) {
        exp.label = newLabel.trim();
      }

      const currentD = new Date(exp.timestamp);
      const yyyy = currentD.getFullYear();
      const mm = String(currentD.getMonth() + 1).padStart(2, '0');
      const dd = String(currentD.getDate()).padStart(2, '0');
      const defaultDate = `${yyyy}-${mm}-${dd}`;
      
      const newDateStr = prompt("Edit date (YYYY-MM-DD):", defaultDate);
      if (newDateStr !== null && newDateStr.trim() !== "") {
        const parsedDate = new Date(newDateStr + 'T12:00:00'); 
        if (!isNaN(parsedDate.getTime())) {
          exp.timestamp = parsedDate.toISOString();
          exp.dateFormatted = parsedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        } else {
          alert("Invalid date format. Please use YYYY-MM-DD.");
        }
      }
      
      saveAndRender();
    }

    function deleteExpense(id) {
      expenses = expenses.filter(exp => exp.id !== id);
      saveAndRender();
    }

    function exportBackup() {
      const backupData = {categories: categories, expenses: expenses, exportDate: new Date().toISOString() };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `expense_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.categories && importedData.expenses) {
            categories = importedData.categories;
            expenses = importedData.expenses;
            localStorage.setItem('quick_categories', JSON.stringify(categories));
            localStorage.setItem('quick_expenses', JSON.stringify(expenses));
            updateCategoryDropdown();
            saveAndRender();
            alert('Backup imported successfully!');
          } else {alert('Invalid backup file format.'); }
        } catch (err) {alert('Error reading backup file.'); }
      };
      reader.readAsText(file);
      event.target.value = ''; 
    }

    // Date Logic Helpers
    function isSinceLastFriday(dateStr) {
      const expDate = new Date(dateStr);
      const now = new Date();
      let daysSinceFriday = now.getDay() - 5;
      if (daysSinceFriday < 0) daysSinceFriday += 7;
      
      const lastFriday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceFriday);
      lastFriday.setHours(0, 0, 0, 0);
      return expDate >= lastFriday;
    }

    function isPreviousFridayCycle(dateStr) {
      const expDate = new Date(dateStr);
      const now = new Date();
      let daysSinceFriday = now.getDay() - 5;
      if (daysSinceFriday < 0) daysSinceFriday += 7;
      
      const lastFriday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceFriday);
      lastFriday.setHours(0, 0, 0, 0);
      
      const previousFriday = new Date(lastFriday.getFullYear(), lastFriday.getMonth(), lastFriday.getDate() - 7);
      return expDate >= previousFriday && expDate < lastFriday;
    }

    function isSinceLastMonth(dateStr) {
      const expDate = new Date(dateStr);
      const now = new Date();
      const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      return expDate >= lastMonthStart;
    }

    function isPastYear(dateStr) {
      const expDate = new Date(dateStr);
      const now = new Date();
      const oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
      return expDate >= oneYearAgo;
    }

    function saveAndRender() {
      localStorage.setItem('quick_expenses', JSON.stringify(expenses));
      const listEl = document.getElementById('expenseList');
      const breakdownEl = document.getElementById('categoryBreakdownList');
      
      const grandTotalEl = document.getElementById('grandTotal');
      const sinceFriTotalEl = document.getElementById('sinceFriTotal');
      const lastWeekTotalEl = document.getElementById('lastWeekTotal'); 
      const lastMonthTotalEl = document.getElementById('lastMonthTotal');
      const monthTotalEl = document.getElementById('monthTotal');
      const yearTotalEl = document.getElementById('yearTotal');
      const entryCountEl = document.getElementById('entryCount');
      
      listEl.innerHTML = '';
      breakdownEl.innerHTML = '';
      
      let grandTotal = 0;
      let sinceFriTotal = 0;
      let lastWeekTotal = 0; 
      let lastMonthTotal = 0;
      let monthTotal = 0;
      let yearTotal = 0;
      
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      let lastMonthIndex = currentMonth - 1;
      let lastMonthYear = currentYear;
      
      if (lastMonthIndex < 0) {
        lastMonthIndex = 11;
        lastMonthYear = currentYear - 1;
      }
      
      let catTotals = {};
      categories.forEach(cat => {
        catTotals[cat] = { sinceFri: 0, lastWeek: 0, lastMonth: 0, thisMonth: 0, year: 0 }; 
      });
      
      if (expenses.length > 0) {
        expenses.forEach(exp => {
          const expDate = new Date(exp.timestamp);
          const amt = exp.amount;
          const cat = exp.category;
          
          grandTotal += amt;
          if (!catTotals[cat]) {
            catTotals[cat] = { sinceFri: 0, lastWeek: 0, lastMonth: 0, thisMonth: 0, year: 0 }; 
          }
          
          if (isSinceLastFriday(exp.timestamp)) {
            sinceFriTotal += amt;
            catTotals[cat].sinceFri += amt;
          }
          if (isPreviousFridayCycle(exp.timestamp)) {
            lastWeekTotal += amt;
            catTotals[cat].lastWeek += amt;
          }
          if (expDate.getMonth() === lastMonthIndex && expDate.getFullYear() === lastMonthYear) {
            lastMonthTotal += amt;
            catTotals[cat].lastMonth += amt;
          }
          if (expDate.getMonth() === currentMonth && expDate.getFullYear() === currentYear) {
            monthTotal += amt;
            catTotals[cat].thisMonth += amt;
          }
          if (expDate.getFullYear() === currentYear) {
            yearTotal += amt;
            catTotals[cat].year += amt;
          }
        });

        // 1. Time Filter Logic
        const filterTimeEl = document.getElementById('filterTime');
        const filterTime = filterTimeEl ? filterTimeEl.value : 'ALL';
        let displayExpenses = [...expenses];
        
        if (filterTime === 'sinceFri') {
          displayExpenses = displayExpenses.filter(exp => isSinceLastFriday(exp.timestamp));
        } else if (filterTime === 'lastMonth') {
          displayExpenses = displayExpenses.filter(exp => isSinceLastMonth(exp.timestamp));
        } else if (filterTime === 'pastYear') {
          displayExpenses = displayExpenses.filter(exp => isPastYear(exp.timestamp));
        }

        // 2. Category Filter Logic
        const filterByEl = document.getElementById('filterCategory');
        const filterBy = filterByEl ? filterByEl.value : 'ALL';
        
        if (filterBy !== 'ALL') {
          displayExpenses = displayExpenses.filter(exp => exp.category === filterBy);
        }

        // 3. Sort Logic
        const sortByEl = document.getElementById('sortBy');
        const sortBy = sortByEl ? sortByEl.value : 'entry';

        if (sortBy === 'dateDesc') {
          displayExpenses.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        } else if (sortBy === 'dateAsc') {
          displayExpenses.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        } else if (sortBy === 'amountDesc') {
          displayExpenses.sort((a, b) => b.amount - a.amount);
        } else if (sortBy === 'amountAsc') {
          displayExpenses.sort((a, b) => a.amount - b.amount);
        }

        // 4. Render List
        if (displayExpenses.length > 0) {
          displayExpenses.forEach(exp => {
            const amt = exp.amount;
            const labelHtml = exp.label ? ` <br><span style="color: #887a96; font-size: 11px;">(${exp.label})</span>` : '';
            
            const li = document.createElement('li');
            li.innerHTML = `
              <span style="flex: 1;"><strong>${exp.dateFormatted}</strong> - ${exp.category}${labelHtml}</span>
              <span style="display: flex; align-items: center; gap: 4px;">
                $${amt.toFixed(2)} 
                <button class="edit-btn" onclick="editExpense(${exp.id})">✎</button>
                <button class="delete-btn" onclick="deleteExpense(${exp.id})">×</button>
              </span>
            `;
            listEl.appendChild(li);
          });
        } else {
          listEl.innerHTML = '<li style="text-align: center; color: #888;">No expenses found for these filters.</li>';
        }

      } else {
        listEl.innerHTML = '<li style="text-align: center; color: #888;">No expenses logged yet.</li>';
      }
      
      categories.forEach((cat, index) => {
        const stats = catTotals[cat];
        const div = document.createElement('div');
        div.className = 'cat-row';
        div.innerHTML = `
          <div class="cat-header">
            <span>${cat}</span>
            <span class="cat-actions">
              <button class="cat-action-btn move-btn" onclick="moveCategory(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;cursor:default;"' : ''}>▲</button>
              <button class="cat-action-btn move-btn" onclick="moveCategory(${index}, 1)" ${index === categories.length - 1 ? 'style="opacity:0.3;cursor:default;"' : ''}>▼</button> | 
              <button class="cat-action-btn edit-cat-btn" onclick="editCategory('${cat}')">Edit</button> | 
              <button class="cat-action-btn delete-cat-btn" onclick="deleteCategory('${cat}')">Delete</button>
            </span>
          </div>
          <div class="cat-stats">
            <div><span>Since Fri.</span>$${stats.sinceFri.toFixed(2)}</div>
            <div><span>Prev Wk.</span>$${stats.lastWeek.toFixed(2)}</div>
            <div><span>Last Mo.</span>$${stats.lastMonth.toFixed(2)}</div>
            <div><span>This Mo.</span>$${stats.thisMonth.toFixed(2)}</div>
            <div><span>Year</span>$${stats.year.toFixed(2)}</div>
          </div>
        `;
        breakdownEl.appendChild(div);
      });
      
      grandTotalEl.textContent = `$${grandTotal.toFixed(2)}`;
      sinceFriTotalEl.textContent = `$${sinceFriTotal.toFixed(2)}`;
      lastWeekTotalEl.textContent = `$${lastWeekTotal.toFixed(2)}`; 
      lastMonthTotalEl.textContent = `$${lastMonthTotal.toFixed(2)}`;
      monthTotalEl.textContent = `$${monthTotal.toFixed(2)}`;
      yearTotalEl.textContent = `$${yearTotal.toFixed(2)}`;
      entryCountEl.textContent = expenses.length;
    }
    
    updateCategoryDropdown();
    saveAndRender();
  </script>
</body>
</html>
